# Production deploy. Pulls a pre-built image from GHCR instead of building.
# The CI deploy job sets IMAGE_NAME + IMAGE_TAG and runs `docker compose up -d`.
#
# Postgres is external — the server's shared instance on `postgres_network`.
# Set DATABASE_URL in .env to reach it by container name. Redis is part of
# this stack: it only ever holds work that is due right now (the schedule
# lives in Postgres), so it needs no sharing and no host port.
#
# Explicit project name. Without it, Compose derives the project from the
# directory basename ("backend"), which collides with sibling repos deployed
# from their own "backend" dir — and `down --remove-orphans` would then treat
# THEIR containers as orphans and delete them. A unique name isolates this stack.
name: tmx
services:
  redis:
    image: redis:7-alpine
    container_name: tmx_redis
    restart: unless-stopped
    # appendonly: a due job claimed from Postgres exists only in Redis until
    # the worker finishes it; losing it on a Redis restart would leave that row
    # in `sending` until the reaper returns it. Persistence shortens that gap.
    command: ["redis-server", "--appendonly", "yes"]
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data
    networks:
      - tmx_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: ${IMAGE_NAME:-ghcr.io/tokenminds-co/tmx-scheduler-backend}:${IMAGE_TAG:-production-latest}
    container_name: tmx_be
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      # Fixed inside the container. PORT in .env is the HOST port (see `ports:`).
      - PORT=4000
      # The stack's own Redis, not whatever REDIS_URL in .env says.
      - REDIS_URL=redis://redis:6379
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.5"
    healthcheck:
      # /health answers 503 until migrations finish and Postgres is reachable,
      # which is what makes --spider (status line only) a real check.
      # 127.0.0.1, not localhost: localhost resolves to ::1 first in this
      # container and the app binds IPv4, so a localhost probe is refused.
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:4000/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - tmx_network
      - postgres_network
    ports:
      # Loopback only: the reverse proxy on the host is what serves it (main.ts
      # trusts exactly one proxy hop). Publishing on 0.0.0.0 would bypass the
      # host firewall and expose an admin API directly.
      # host (from .env PORT, default 4000) : container/app port (fixed 4000)
      - "127.0.0.1:${PORT:-4000}:4000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis_data:
    driver: local

networks:
  tmx_network:
    driver: bridge
  postgres_network:
    external: true
