# Runs the production image locally, built from source. Use it to check the
# image itself — the container, the migration step, the health probe. For
# day-to-day development the root docker-compose.yml (Redis and Mailpit, app
# running on the host) is the faster loop.
#
#   docker compose -f backend/docker-compose.yml up --build
#
# One service, like production: Postgres and Redis stay where they already are.
# Locally that is the root compose file's `tmx-postgres` on 5432 and
# `tmx-redis` on 6379, so both are reached through `host.docker.internal` —
# inside a container, "localhost" is the container. Every other value comes
# from backend/.env unchanged.
#
# Explicit project name so `down --remove-orphans` stays scoped to this stack
# and never touches sibling projects that also live in a "backend" directory.
# It is also distinct from the root compose file's project, so the two never
# fight over each other's containers.
name: tmx
services:
  backend:
    build:
      # .. is the workspace root: the install needs pnpm-lock.yaml and
      # packages/shared. `dockerfile` is relative to that context.
      context: ..
      dockerfile: backend/Dockerfile
      target: production
    container_name: tmx_be
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      # Fixed inside the container. PORT in .env is the HOST port (see `ports:`).
      - PORT=4000
      # DATABASE_URL and REDIS_URL in .env point at localhost, which inside a
      # container means the container itself. Rewritten to the host, where both
      # services actually are. The ports match the root compose file: 5432 for
      # Postgres, 6379 for Redis.
      - DATABASE_URL=postgresql://postgres:postgres@host.docker.internal:5432/mail_scheduler?schema=public
      - REDIS_URL=redis://host.docker.internal:6379
    # Docker Desktop resolves host.docker.internal on its own; on Linux it does
    # not exist until this maps it to the bridge gateway.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.5"
    healthcheck:
      # /health answers 503 until Postgres is reachable, which is what makes
      # --spider (status line only) a real check.
      # 127.0.0.1, not localhost: localhost resolves to ::1 first in this
      # container and the app binds IPv4, so a localhost probe is refused.
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:4000/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    ports:
      # host (from .env PORT, default 4000) : container/app port (fixed 4000)
      - "127.0.0.1:${PORT:-4000}:4000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
