# Local infrastructure for TMX Scheduler: Postgres, Redis and Mailpit.
#
# Every port below is published on 127.0.0.1 only. Redis runs without
# authentication and Postgres with a throwaway password, so binding either to
# 0.0.0.0 would put an open datastore on whatever network the laptop is joined
# to.
services:
  # The default DATABASE_URL in backend/.env.example points here. A machine
  # that already runs Postgres on 5432 can change the host port below and the
  # URL together; nothing else reads it.
  postgres:
    image: postgres:16-alpine
    container_name: tmx-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mail_scheduler
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d mail_scheduler']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: tmx-redis
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # Catches every outbound SMTP send in development so no real mail escapes.
  # Web UI on http://localhost:8025, SMTP on 1025 (no auth, no TLS).
  # No volume: the inbox is disposable and empties when the container is
  # recreated.
  mailpit:
    image: axllent/mailpit:latest
    container_name: tmx-mailpit
    ports:
      - '127.0.0.1:8025:8025'
      - '127.0.0.1:1025:1025'

volumes:
  postgres-data:
  redis-data:
